<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4ec" />
    <meta name="description" content="A study planner that keeps you on one task at a time." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" />
    <title>One Thing</title>
    <script>
      // Runs before the app. Two safety nets so the screen is never just blank:
      // 1) /?reset clears the offline copy (service worker + caches) and reloads. Tasks live on the server; the access key stays.
      // 2) If the app hasn't drawn anything after 8 s, show a message with the error and a reset link.
      (function () {
        var errs = (window.__otErrors = []);
        window.addEventListener('error', function (e) { errs.push(String(e.message || e)); });
        window.addEventListener('unhandledrejection', function (e) { errs.push(String((e.reason && e.reason.message) || e.reason)); });
        if (/[?&]reset\b/.test(location.search)) {
          var go = function () { location.replace('/'); };
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(go, go);
          setTimeout(go, 4000);
          return;
        }
        window.__otFallback = setTimeout(function () {
          var r = document.getElementById('root');
          if (!r || r.children.length) return;
          var esc = function (t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
          r.innerHTML = '<div style="font:16px/1.5 system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:24px;background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(150,80,30,.12);color:#2a211b">' +
            '<h2 style="margin:0 0 8px">The app didn’t start</h2>' +
            '<p style="margin:0 0 16px;color:#8a7d72">This is usually an old offline copy. Resetting fixes it. Your tasks are saved online and won’t be lost.</p>' +
            '<a href="/?reset" style="display:inline-block;background:#f5653a;color:#fff;padding:10px 18px;border-radius:99px;text-decoration:none;font-weight:700">Reset the app</a>' +
            (errs.length ? '<pre style="white-space:pre-wrap;font-size:12px;color:#b4532a;margin:16px 0 0">' + esc(errs.slice(0, 3).join('\n')) + '</pre>' : '') +
            '</div>';
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
